name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests with coverage
        run: pnpm --filter @finora/api test:cov

      - name: Run web tests with coverage
        run: pnpm --filter @finora/test test:cov

      # Coverage reports use paths relative to each app's own root; SonarCloud needs them relative to the repo root.
      - name: Normalize coverage paths for SonarCloud
        run: |
          sed -i 's|^SF:|SF:apps/api/|' apps/api/coverage/lcov.info
          sed -i 's|^SF:|SF:apps/web/|' apps/web/test/coverage/lcov.info

      # Requires SONAR_TOKEN secret and SONAR_ORGANIZATION/SONAR_PROJECT_KEY repository variables (see README.md#cicd).
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
